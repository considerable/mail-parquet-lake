name: Dashboard
on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'scripts/build_dashboard.py'
      - 'tests/test_dashboard.py'
      - '.github/workflows/dashboard.yml'
  schedule:
    - cron: '23,53 * * * *'
  workflow_run:
    workflows: ['Gmail Sync', 'Job Tracker', 'Security & Code Quality']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      # Always use trusted default-branch source, never triggering PR artifacts/code.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: pip install requests
      - run: python -m unittest discover -s tests -p 'test_dashboard.py'
      - name: Collect public workflow metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build_dashboard.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dashboard
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4