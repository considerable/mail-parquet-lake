name: Dashboard
on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'scripts/build_dashboard.py'
      - 'scripts/public_executive.py'
      - 'tests/test_dashboard.py'
      - '.github/workflows/dashboard.yml'
  schedule:
    - cron: '23,53 * * * *'
  workflow_run:
    workflows: ['Gmail Sync', 'Job Tracker', 'Security & Code Quality', 'Executive Observability']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      # Always use trusted default-branch source, never triggering PR artifacts/code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install requests
      - run: python -m unittest discover -s tests -p 'test_dashboard.py'
      - name: Collect public workflow metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build_dashboard.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dashboard
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
