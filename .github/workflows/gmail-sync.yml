name: Gmail Sync
on:
  schedule:
    - cron: '0 10 * * 1-5'  # Mon-Fri 6am ET (UTC-4)
    - cron: '0 14 * * 1-5'  # Mon-Fri 10am ET
    - cron: '0 18 * * 1-5'  # Mon-Fri 2pm ET
    - cron: '0 22 * * 1-5'  # Mon-Fri 6pm ET
    - cron: '0 0 * * 2-6'   # Mon-Fri 8pm ET (next UTC day)
    - cron: '0 10 * * 0,6'  # Sat-Sun 6am ET
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
          - attachment-backfill
          - telemetry-check

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.event.inputs.mode == 'telemetry-check' && 'gmail-telemetry-check' || 'gmail-lake-writer' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/job-tracker-ci
          role-session-name: gmail-sync
          aws-region: us-west-2
          role-duration-seconds: 21600

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Start OpenTelemetry Collector
        env:
          AWS_REGION: us-west-2
          CLOUDWATCH_LOG_GROUP: /mail-parquet-lake/otel
        run: |
          export CLOUDWATCH_LOG_STREAM="github/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          aws logs create-log-stream --log-group-name "$CLOUDWATCH_LOG_GROUP" --log-stream-name "$CLOUDWATCH_LOG_STREAM"
          docker run -d --name lake-otel --memory 384m \
            -p 127.0.0.1:4318:4318 -p 127.0.0.1:13133:13133 \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            -e AWS_REGION -e CLOUDWATCH_LOG_GROUP -e CLOUDWATCH_LOG_STREAM \
            -v "$PWD/observability/collector.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:13133/; then exit 0; fi
            sleep 1
          done
          docker logs lake-otel
          exit 1

      - name: Write Gmail credentials
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for name, variable in [("credentials.json", "GMAIL_CREDENTIALS_JSON"), ("token.json", "GMAIL_TOKEN_JSON")]:
              Path(name).write_text(os.environ[variable])
              Path(name).chmod(0o600)
          PY

      - name: Run sync
        env:
          SYNC_MODE: ${{ github.event.inputs.mode || 'incremental' }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ secrets.S3_PREFIX }}
          GMAIL_ACCOUNT: ${{ secrets.GMAIL_ACCOUNT }}
          GMAIL_CREDENTIALS_FILE: credentials.json
          GMAIL_TOKEN_FILE: token.json
          GMAIL_NONINTERACTIVE: "1"
          PYTHONUNBUFFERED: "1"
          LAKE_TELEMETRY_ENABLED: "1"
          OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
        run: |
          echo "## 📬 Gmail Sync — $(date +%Y-%m-%d) ($SYNC_MODE)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$SYNC_MODE" = "incremental" ]; then
            python3 sync/gmail_sync.py --incremental --resume-pending-backfill --max-seconds 3600
          else
            python3 sync/gmail_sync.py --"$SYNC_MODE"
          fi
          echo "✅ Requested sync pass complete (backfill progress is in the run log)" >> $GITHUB_STEP_SUMMARY

      - name: Flush OpenTelemetry Collector
        if: always()
        run: |
          if docker inspect lake-otel > /dev/null 2>&1; then
            docker stop --time 30 lake-otel
            docker logs lake-otel
            docker rm lake-otel
          fi
